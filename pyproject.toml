[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-mail-agent"
version = "0.1.0"
description = "Agent-driven CRUD layer for iCloud Mail (IMAP). Cascade is the brain, this is the hands."
requires-python = ">=3.11"
authors = [{ name = "Edo Sulai" }]
license = { text = "MIT" }
dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
mail-agent = "mail_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mail_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
