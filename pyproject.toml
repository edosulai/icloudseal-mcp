[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icloudseal-mcp"
version = "0.2.0"
description = "Sealed iCloud MCP/CLI — local Mail, Contacts, Calendar, Messages, Notes, Drive, Photos with gated mutations and planned Touch ID approval."
requires-python = ">=3.11"
authors = [{ name = "Edo Sulai" }]
license = { text = "MIT" }
dependencies = [
    "rich>=13.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
icloudseal-mcp = "icloudseal_mcp.cli:main"
mail-agent = "icloudseal_mcp.cli:mail_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["icloudseal_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
