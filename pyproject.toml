[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-agent"
version = "0.2.0"
description = "Agent-driven CRUD layer for iCloud services (Mail/IMAP, Contacts/CardDAV, ...). The agent is the brain, this is the hands."
requires-python = ">=3.11"
authors = [{ name = "Edo Sulai" }]
license = { text = "MIT" }
dependencies = [
    "rich>=13.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
icloud-agent = "icloud_agent.cli:main"
mail-agent = "icloud_agent.cli:mail_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["icloud_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
