[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icloudseal-mcp"
version = "0.8.1"
description = "Sealed iCloud MCP/CLI — local Mail, Contacts, Calendar, Messages, Notes, Drive, Photos, Safari, Music, Weather, Maps, Health, and ops with gated mutations and Touch ID approval."
requires-python = ">=3.11"
authors = [{ name = "Edo Sulai" }]
license = { text = "MIT" }
dependencies = [
    "rich>=13.7",
    "requests>=2.31",
    "mcp>=2.0,<3",
    "anyio>=4.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3",
    "anyio>=4.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
icloudseal-mcp = "icloudseal_mcp.cli:main"
mail-agent = "icloudseal_mcp.cli:mail_main"
icloudseal-mcp-server = "icloudseal_mcp.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["icloudseal_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
